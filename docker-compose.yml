services:
  app:
    image: piskegram-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piskegram-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLASK_APP: app.py
      PYTHONUNBUFFERED: "1"
    ports:
      - "5000:5000"
    command: python app.py